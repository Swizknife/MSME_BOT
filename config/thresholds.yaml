# Coverage Gate thresholds (docs/RAG_IMPLEMENTATION.md section 6.3;
# multi-source structure per docs/OKF_RAG_IMPLEMENTATION.md section 5).
#
# These are PLACEHOLDER defaults, not calibrated values -- the build
# sequence calibrates tau_hard/tau_soft against the reranker-score
# distributions of the in-scope vs out-of-scope halves of the golden eval
# set (a 60/40 calibration/held-out split, to avoid the circularity of
# tuning and reporting accuracy on the same data). Until that eval set
# exists, app/retrieval/coverage_gate.py falls back to these same numbers
# if this file is ever deleted, so the two must be kept in sync by hand.
#
# Deliberately conservative (tau_hard biased high, toward abstaining): for
# a government policy bot, an incorrect refusal is far cheaper than an
# answer that isn't actually grounded in the policy text.
#
# `default` applies when a chunk carries no source_type, or its source_type
# has no entry under by_source_type. `by_source_type` lets different source
# registers (a scraped HTML FAQ page reranks on a different scale than a
# structured policy PDF) calibrate separately once enough eval volume
# exists per type -- coverage_gate.py.decide() keys on the top-ranked
# chunk's own source_type. Every entry here is still the same uncalibrated
# placeholder; only `structured_policy_pdf` has any real traffic so far
# (the one migrated source), so the others are copied defaults, not
# independently fitted values.

default:
  tau_hard: 0.35
  tau_soft: 0.55

by_source_type:
  structured_policy_pdf:
    tau_hard: 0.35
    tau_soft: 0.55
  scraped_html_faq:
    tau_hard: 0.35
    tau_soft: 0.55
  api_tabular:
    tau_hard: 0.35
    tau_soft: 0.55

calibrated: false
calibrated_at: null
calibrated_against: null   # eval run id, once a real golden set exists
