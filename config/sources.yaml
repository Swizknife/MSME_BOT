    blocked: true
    refresh_cadence: on_notification
    manual_fallback_instructions: >
      Already acquired: data/raw/msme_policy_2026.pdf (from the original
      single-document build). Re-verify against the live portal before
      re-ingesting if the draft is notified or amended.

  - source_id: MSMED_ACT_2006
    <<: *defaults
    name: "Micro, Small and Medium Enterprises Development Act, 2006"
    short_name: MSMED-ACT
    scheme_id: MSMED_ACT_2006
    tier: P0
    url: "https://dcmsme.gov.in/publications/msmed_actx.html"
    fetch_strategy: pdf_download
    blocked: false
    refresh_cadence: on_notification
    # Attempted 2026-09-23 via a single manual WebFetch (prototype-scale,
    # NOT the automated acquisition pipeline -- that's still Phase 2 and
    # still gated on compliance_checked, unchanged above). PARTIAL FAILURE,
    # recorded honestly rather than silently dropped: the index page at
    # `url` links to the Act's PDF (dcmsme.gov.in/MSMED2006.pdf), but that
    # PDF is a scanned image with no text layer -- unreadable by the fetch
    # tool used. A second attempt via indiacode.nic.in returned HTTP 403.
    # data/okf_vault/09_acts/MSMED_ACT_2006.md records what WAS confirmed
    # (via a secondary source describing this Act's delayed-payment rule)
    # and marks section-level detail explicitly unconfirmed rather than
    # guessed. Real primary-text extraction (OCR, or a text-layer source)
    # is still open work.
    last_fetched_at: "2026-09-23T00:00:00"
    last_fetch_status: "partial_failure_scanned_pdf_no_text_layer"
    checksum_of_last_fetch: null

