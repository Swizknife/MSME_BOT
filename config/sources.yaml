# OKF+RAG dataset source registry.
#
# One entry per source in the Phase-1 acquisition scope (P0 core + P1 major
# schemes, ~24 sources total -- see docs/OKF_RAG_IMPLEMENTATION.md §6 and
# HANDOFF.md for why P2/P3 from the original ~68-source research catalog are
# out of scope for this rebuild).
#
# fetch_strategy: html_scrape | pdf_download | api | manual
# blocked: true means the portal is known (from prior manual research) to
#   block scripted fetching -- these start life as manual_pending, not as a
#   failure. See manual_fallback_instructions.
#
# ---------------------------------------------------------------------------
# COMPLIANCE GATE -- enforced, not advisory.
#
# `compliance_checked: false` on every entry below means nobody has yet
# reviewed that source's robots.txt and terms of use. The Phase 2
# acquisition runner MUST refuse to perform an automated fetch
# (html_scrape / pdf_download / api) against any source where
# `compliance_checked` is not true AND `robots_txt_status` is not
# `allowed`. It should skip the source and report it, rather than fetch.
#
# This is deliberately a hard gate rather than a note: 9 of the 24 sources
# below carry an automated fetch_strategy (8 html_scrape + 1 pdf_download),
# so without it the first run of run_acquisition.py would scrape government
# portals whose terms nobody has read. Clearing the gate is a per-source human review that sets both
# fields; `license_notes` below is a generic placeholder until then and is
# NOT a licensing determination.
#
# The `manual` strategy is exempt: a person downloading a public document
# in a browser is not automated access, so those 15 sources can proceed
# without the gate being cleared.
# ---------------------------------------------------------------------------
# last_fetched_at / last_fetch_status / checksum_of_last_fetch: null until
#   the Phase 2 acquisition pipeline (backend/app/acquisition/) exists and
#   runs. This file is a registry skeleton, not a record of completed work.

defaults: &defaults
  robots_txt_status: unknown        # allowed | disallowed | unknown
  compliance_checked: false         # gate: automated fetch refused while false -- see COMPLIANCE GATE above
  compliance_checked_by: null
  compliance_checked_at: null
  license_notes: "PLACEHOLDER -- not a licensing determination. Public government scheme/policy document or portal; must be reviewed per-source before any automated fetch."
  last_fetched_at: null
  last_fetch_status: null           # ok | failed | stale | manual_pending
  checksum_of_last_fetch: null
  manual_fallback_instructions: null

